name: Security guard verification
on:
  push:
    branches:
      - feature/donation-abuse-guard-20261109
  pull_request:
    branches:
      - main
  workflow_dispatch:
jobs:
  guard-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Run full integration suite
        env:
          DATABASE_URL: mongodb://127.0.0.1:27017/yedicihan_ci_readonly
        run: |
          npx prisma generate
          npx prisma generate --schema prisma/integration-settings.schema.prisma
          npm run test:integration-settings
      - name: Validate integration release TypeScript
        run: npm run typecheck:integration-release
      - name: Run isolated security guard tests
        run: node --import tsx --test tests/integration-settings/donation-abuse-policy.test.ts tests/integration-settings/payment-initiation-budget.test.ts tests/integration-settings/emergency-maintenance-contract.test.ts tests/integration-settings/donation-fraud-persistence-contract.test.ts tests/integration-settings/verified-gateway-decline-wiring.test.ts tests/integration-settings/payfor-authentication.test.ts tests/integration-settings/trusted-donor-exemption.test.ts
