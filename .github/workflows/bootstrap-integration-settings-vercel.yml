# SECURITY HOLD: This workflow previously embedded a project/team ID belonging
# to another organization and a PR comment target outside this repository.
# Never run Vercel login/link/env/deploy from this workflow until an explicit
# approved YediCihan team, project, Git repository and production domain are
# verified and recorded in a reviewed release-specific PR.
name: YediCihan Vercel bootstrap (identity verification required)
on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Review only; this workflow never deploys."
        required: false
        type: string
permissions:
  contents: read
jobs:
  identity-hold:
    runs-on: ubuntu-24.04
    steps:
      - name: Refuse all Vercel operations until identity and access approval
        run: |
          echo "NO-GO: approved YediCihan Vercel team/project/repository/domain missing."
          echo "No credentials, production variables, deployments or other organizations may be used."
          exit 1
