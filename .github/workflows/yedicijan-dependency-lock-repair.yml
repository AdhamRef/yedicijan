name: YediCihan one-time dependency lock repair (review branch only)
on:
  pull_request:
    types: [synchronize, opened]
    branches: [main]
    paths:
      - ".github/workflows/yedicijan-dependency-lock-repair.yml"
permissions:
  contents: write
jobs:
  lock-repair:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'integration/yedicijan-unified-safe-20261109'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Fetch exact internal branch revision
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" fetch --no-tags --depth=1 origin "$HEAD_SHA"
          git checkout --force --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
      - name: Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
      - name: Update only four documented dependencies and lock metadata
        run: |
          set -euo pipefail
          npm install --package-lock-only --save-exact --ignore-scripts --legacy-peer-deps --no-audit --no-fund react-day-picker@8.10.2 @radix-ui/react-slider@1.3.6 @radix-ui/react-toast@1.2.15 @vercel/blob@2.3.1
          npm ci --ignore-scripts --legacy-peer-deps --no-audit --no-fund
          npx prisma generate --schema prisma/schema.prisma
          npx tsc --noEmit --incremental false --pretty false > /tmp/ts-output.txt 2>&1 || true
          echo 'TypeScript after dependency upgrade (remaining diagnostics):'
          grep -E 'error TS[0-9]+' /tmp/ts-output.txt | head -n 20 || true
          git diff --check
          git status --short
      - name: Commit exact package manifest and lockfile to same Draft PR branch
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git add -- package.json package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(deps): lock missing UI primitives and private Vercel Blob SDK"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/integration/yedicijan-unified-safe-20261109
