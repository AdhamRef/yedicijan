name: YediCihan PR9 PayFor P0 combined TypeScript Build QA
on:
  push:
    branches:
      - integration/yedi-pr9-payfor19-qa-20261110
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      DATABASE_URL: mongodb://127.0.0.1:27017/yedi_ci_no_connection?replicaSet=rs0
      CI: "1"
      GOOGLE_CLIENT_ID: synthetic-ci-oauth-client
      GOOGLE_CLIENT_SECRET: synthetic-ci-oauth-secret
      NEXTAUTH_SECRET: synthetic-ci-nextauth-secret-only-for-nonproduction-build
      NEXTAUTH_URL: http://127.0.0.1:3000
    steps:
      - name: Fetch exact reviewed commit without legacy gitlink
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --force --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --legacy-peer-deps --no-audit --no-fund
      - name: Generate Prisma clients
        run: |
          npx --no-install prisma generate --schema prisma/schema.prisma
          npx --no-install prisma generate --schema prisma/integration-settings.schema.prisma
      - name: Full TypeScript check, no error suppression
        run: npx --no-install tsc --noEmit --incremental false --pretty false
      - name: Build combined PR9 and PR19 (synthetic env)
        run: npm run build
