name: YediCihan communications locale contract
on:
  pull_request:
    branches: [main]
    paths:
      - "lib/communication/language-coverage.ts"
      - "tests/finance/communication-active-locales.test.ts"
      - ".github/workflows/yedicijan-communications-locale.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  locale-coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "1"
    steps:
      - name: Checkout exact PR revision without legacy submodule
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" fetch --no-tags --depth=1 origin "$HEAD_SHA"
          git checkout --force --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
      - name: Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
      - name: Install without lifecycle scripts
        run: npm ci --ignore-scripts --legacy-peer-deps --no-audit --no-fund
      - name: Test enabled-only coverage and preserved locale configuration
        run: |
          node --import tsx --test tests/finance/communication-active-locales.test.ts
          npm run locale:audit:strict
