name: YediCihan donor CRM review (no live sends or payments)
on:
  pull_request:
    branches: [main]
    paths:
      - "app/api/admin/donor-segments/**"
      - "app/(dashboard)/dashboard/users/donors/**"
      - "lib/communication/donor-segment-validation.ts"
      - "tests/finance/donor-segment-validation.test.ts"
      - ".github/workflows/yedicijan-donor-crm-review.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  donor-crm:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DATABASE_URL: mongodb://127.0.0.1:27017/yedicijan_ci_never_connected?replicaSet=rs0
      CI: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Fetch exact PR revision (no legacy submodule init)
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" fetch --no-tags --depth=1 origin "$HEAD_SHA"
          git checkout --force --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
      - name: Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
      - name: Install lockfile without lifecycle scripts
        run: npm ci --ignore-scripts --legacy-peer-deps --no-audit --no-fund
      - name: Validate Prisma offline and generate client
        run: |
          npx prisma validate --schema prisma/schema.prisma
          npx prisma generate --schema prisma/schema.prisma
      - name: Run CRM schema and input contracts (synthetic only)
        run: node --import tsx --test tests/finance/donor-segment-validation.test.ts
      - name: Preserve YediCihan language policy
        run: |
          node scripts/audit-locales.mjs --strict
      - name: Scoped TypeScript checks
        run: |
          npm run typecheck:communication-runtime
          npm run typecheck:integration-release
      - name: Full TypeScript check (reports baseline failures)
        run: npx tsc --noEmit --incremental false
