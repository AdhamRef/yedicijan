name: YediCihan finance review (isolated)
on:
  pull_request:
    branches: [main]
    paths:
      - "app/api/donations/route.ts"
      - "app/api/admin/donations/export/route.ts"
      - "app/api/admin/monthly/export/route.ts"
      - "app/(dashboard)/dashboard/monthly/page.tsx"
      - "lib/dashboard/report-donation-filter.ts"
      - "scripts/verify-money-invariants.ts"
      - "tests/finance/**"
      - ".github/workflows/yedicijan-finance-review.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  finance-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # This repository contains a legacy gitlink named gozbebekleri without
      # a .gitmodules URL; actions/checkout fails in its auth cleanup step.
      # Fetch the exact PR head without initializing submodules or persisting auth.
      - name: Fetch exact review commit (no submodules)
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" fetch --no-tags --depth=1 origin "$HEAD_SHA"
          git checkout --force --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies (no lifecycle scripts)
        run: npm ci --ignore-scripts --legacy-peer-deps --no-audit --no-fund
      - name: Run synthetic financial report contracts
        run: node --import tsx --test tests/finance/*.test.ts
