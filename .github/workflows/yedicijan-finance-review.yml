name: YediCihan finance review (isolated)
on:
  pull_request:
    branches: [main]
    paths:
      - "app/api/donations/route.ts"
      - "app/api/admin/donations/export/route.ts"
      - "app/api/admin/monthly/export/route.ts"
      - "app/(dashboard)/dashboard/monthly/page.tsx"
      - "lib/dashboard/report-donation-filter.ts"
      - "scripts/verify-money-invariants.ts"
      - "tests/finance/**"
      - ".github/workflows/yedicijan-finance-review.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  finance-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout reviewed changes
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies (no lifecycle scripts)
        run: npm ci --ignore-scripts --legacy-peer-deps --no-audit --no-fund
      - name: Run synthetic financial report contracts
        run: node --import tsx --test tests/finance/*.test.ts
